version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: apaar_postgres
    restart: always
    environment:
      POSTGRES_USER: apaar_user
      POSTGRES_PASSWORD: apaar_password
      POSTGRES_DB: apaar_vault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apaar_user -d apaar_vault"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apaar_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+psycopg2://apaar_user:apaar_password@db:5432/apaar_vault
      - SECRET_KEY=apaar-vault-production-secret-key-change-me
      - DEMO_MODE=True
      - CORS_ORIGINS=["http://localhost:3001","http://127.0.0.1:3001"]
      - FRONTEND_URL=http://localhost:3001
    ports:
      - "8080:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apaar_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
